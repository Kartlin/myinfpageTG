<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Мои подарки (админка)</title>

  <style>
    :root {
      --bg: #1a1025;
      --card: rgba(45, 27, 62, 0.82);
      --card-light: rgba(255, 255, 255, 0.06);
      --text: #f8fafc;
      --muted: #d4c4e8;
      --accent: #f472b6;
      --accent-2: #fb923c;
      --border: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(244, 114, 182, 0.22), transparent 35%),
        radial-gradient(circle at bottom right, rgba(251, 146, 60, 0.18), transparent 35%),
        var(--bg);
      line-height: 1.6;
    }

    a {
      color: var(--accent-2);
      text-decoration: none;
      transition: 0.25s ease;
    }

    a:hover {
      color: #fdba74;
      text-decoration: underline;
    }

    .container {
      width: min(1100px, 92%);
      margin: 0 auto;
    }

    header {
      padding: 60px 0 40px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .small-label {
      display: inline-block;
      margin-bottom: 18px;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--card-light);
      font-size: 14px;
    }

    h1 {
      font-size: clamp(36px, 6vw, 64px);
      line-height: 1.1;
      letter-spacing: -1.5px;
    }

    .gradient-text {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      max-width: 600px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: 18px;
    }

    section {
      padding: 40px 0 80px;
    }

    .section-title {
      margin-bottom: 30px;
      font-size: 28px;
      color: var(--accent);
    }

    .admin-panel {
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      margin-bottom: 40px;
    }

    .form-row {
      margin-bottom: 14px;
    }

    .form-row label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .form-row input,
    .form-row textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font: inherit;
    }

    .form-row textarea {
      min-height: 80px;
      resize: vertical;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      padding: 11px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-light);
      color: var(--text);
      cursor: pointer;
      font: inherit;
      transition: 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.14);
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ec4899, #f97316);
      border: none;
      box-shadow: 0 8px 20px rgba(236, 72, 153, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .gifts-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .gift-item {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .gift-item img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
    }

    .gift-item h3 {
      font-size: 19px;
    }

    .gift-item p {
      color: var(--muted);
      font-size: 15px;
      flex-grow: 1;
    }

    .gift-item a {
      display: inline-block;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .gift-item .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 30px;
      padding: 11px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      background: var(--card-light);
    }

    .back-button:hover {
      color: var(--text);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.12);
    }

    footer {
      padding: 30px 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 800px) {
      .gifts-list {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="container">
      <a class="back-button" href="index.html">← На главную</a>
      <a class="back-button" href="gifts.html">← К обычному списку</a>

      <div class="page-title">
        <span class="small-label">админка</span>
        <h1>
          Управление <span class="gradient-text">подарками</span>
        </h1>
        <p class="subtitle">
          Добавляй, редактируй и удаляй подарки. Данные хранятся только в твоём браузере.
        </p>
      </div>
    </div>
  </header>

  <main>
    <section>
      <div class="container">

        <div class="admin-panel">
          <h2 class="section-title">Добавить / редактировать подарок</h2>

          <input type="hidden" id="g-index" value="-1" />

          <div class="form-row">
            <label for="g-name">Название</label>
            <input id="g-name" placeholder="Например: Коврик для мыши" />
          </div>

          <div class="form-row">
            <label for="g-desc">Описание</label>
            <textarea id="g-desc" placeholder="Краткое описание подарка"></textarea>
          </div>

          <div class="form-row">
            <label for="g-link">Ссылка на товар</label>
            <input id="g-link" placeholder="https://..." />
          </div>

          <div class="form-row">
            <label for="g-photo">URL фото</label>
            <input id="g-photo" placeholder="https://..." />
          </div>

          <div class="form-actions">
            <button class="btn btn-primary" onclick="saveGift()">Сохранить подарок</button>
            <button class="btn" onclick="clearForm()">Очистить форму</button>
            <button class="btn btn-danger" onclick="clearAllGifts()">Удалить весь список</button>
          </div>
        </div>

        <h2 class="section-title">Список подарков</h2>
        <div id="gifts-list" class="gifts-list"></div>

      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      © 2026 Kartlin. Админка для личного списка подарков.
    </div>
  </footer>

  <script>
    const STORAGE_KEY = 'my_personal_gifts';

    function loadGifts() {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }

    function saveGifts(gifts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(gifts));
    }

    function renderGifts() {
      const list = loadGifts();
      const container = document.getElementById('gifts-list');
      container.innerHTML = '';

      list.forEach((gift, index) => {
        const item = document.createElement('div');
        item.className = 'gift-item';

        if (gift.photo) {
          const img = document.createElement('img');
          img.src = gift.photo;
          img.alt = gift.name || 'Фото подарка';
          item.appendChild(img);
        }

        const title = document.createElement('h3');
        title.textContent = gift.name || 'Без названия';
        item.appendChild(title);

        if (gift.desc) {
          const desc = document.createElement('p');
          desc.textContent = gift.desc;
          item.appendChild(desc);
        }

        if (gift.link) {
          const a = document.createElement('a');
          a.href = gift.link;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = 'Открыть ссылку';
          item.appendChild(a);
        }

        const actions = document.createElement('div');
        actions.className = 'actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn';
        editBtn.textContent = 'Редактировать';
        editBtn.onclick = () => editGift(index);
        actions.appendChild(editBtn);

        const delBtn = document.createElement('button');
        delBtn.className = 'btn btn-danger';
        delBtn.textContent = 'Удалить';
        delBtn.onclick = () => deleteGift(index);
        actions.appendChild(delBtn);

        item.appendChild(actions);
        container.appendChild(item);
      });
    }

    function saveGift() {
      const indexInput = document.getElementById('g-index');
      const name = document.getElementById('g-name').value.trim();
      const desc = document.getElementById('g-desc').value.trim();
      const link = document.getElementById('g-link').value.trim();
      const photo = document.getElementById('g-photo').value.trim();

      if (!name && !desc && !link && !photo) {
        alert('Заполните хотя бы одно поле');
        return;
      }

      const gifts = loadGifts();
      const index = parseInt(indexInput.value, 10);

      if (index >= 0 && index < gifts.length) {
        gifts[index] = { name, desc, link, photo };
      } else {
        gifts.push({ name, desc, link, photo });
      }

      saveGifts(gifts);
      clearForm();
      renderGifts();
    }

    function clearForm() {
      document.getElementById('g-index').value = '-1';
      document.getElementById('g-name').value = '';
      document.getElementById('g-desc').value = '';
      document.getElementById('g-link').value = '';
      document.getElementById('g-photo').value = '';
    }

    function editGift(index) {
      const gifts = loadGifts();
      const gift = gifts[index];

      document.getElementById('g-index').value = String(index);
      document.getElementById('g-name').value = gift.name || '';
      document.getElementById('g-desc').value = gift.desc || '';
      document.getElementById('g-link').value = gift.link || '';
      document.getElementById('g-photo').value = gift.photo || '';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteGift(index) {
      if (!confirm('Удалить этот подарок?')) return;
      const gifts = loadGifts();
      gifts.splice(index, 1);
      saveGifts(gifts);
      renderGifts();
    }

    function clearAllGifts() {
      if (!confirm('Удалить ВЕСЬ список подарков? Это действие нельзя отменить.')) return;
      localStorage.removeItem(STORAGE_KEY);
      renderGifts();
    }

    renderGifts();
  </script>

</body>
</html>
